<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — KopiKonek</title>
  <meta name="description" content="Sign in or create your KopiKonek account to track fresh roast drops, save your grind preferences, and manage multi-vendor coffee orders." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#F9F8F6',
            espresso: '#2C1E16',
            terracotta: '#CC5500',
            rust: '#C45E3A',
            sage: '#7C9082',
            taupe: '#EDE8E1'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body { background: #F9F8F6; }
    .font-serif { font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; }
    .fade-in { animation: fadeIn .4s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin .8s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  </style>
</head>
<body class="min-h-screen bg-cream font-sans text-espresso antialiased flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <script src="assets/data.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo } = React;
    const BM = window.BM;

    function getRedirectTarget() {
      const params = new URLSearchParams(window.location.search);
      const r = params.get('redirect');
      if (r === 'checkout') return 'checkout.html';
      return 'index.html';
    }

    const EyeIcon = ({ open }) => open ? (
      <svg className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.1A9.8 9.8 0 0112 5c5 0 9.3 3.1 11 7.5a11.6 11.6 0 01-4.3 5.2M6.2 6.2A11.5 11.5 0 001 12.5C2.7 16.9 7 20 12 20c1.9 0 3.7-.5 5.3-1.3" />
      </svg>
    ) : (
      <svg className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    );

    const CheckIcon = ({ className = 'h-4 w-4' }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2.4" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="m5 13 4 4L19 7" />
      </svg>
    );

    function inputClass(hasErr) {
      return 'w-full rounded-xl border bg-white px-4 py-3 text-sm text-espresso placeholder:text-espresso/35 outline-none transition ' +
        'focus:border-espresso/60 focus:ring-4 focus:ring-espresso/10 ' +
        (hasErr ? 'border-red-400' : 'border-espresso/15 hover:border-espresso/30');
    }

    function LoginApp() {
      const redirectUrl = useMemo(() => getRedirectTarget(), []);
      const redirectLabel = redirectUrl === 'checkout.html' ? 'Checkout' : 'Marketplace';

      const [currentUser, setCurrentUser] = useState(() => BM.auth.user());
      const [mode, setMode] = useState('signin'); // 'signin' | 'signup' | 'forgot'
      const [role, setRole] = useState('buyer'); // 'buyer' | 'roaster'
      const [showPass, setShowPass] = useState(false);
      const [remember, setRemember] = useState(true);
      const [loading, setLoading] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [submitted, setSubmitted] = useState(false);

      // Sign in state
      const [signInForm, setSignInForm] = useState({ email: '', password: '' });
      // Sign up state
      const [signUpForm, setSignUpForm] = useState({
        firstName: '',
        lastName: '',
        roasteryName: '',
        email: '',
        phone: '',
        city: 'Jakarta Selatan',
        password: '',
        agree: true
      });
      // Forgot password state
      const [forgotEmail, setForgotEmail] = useState('');
      const [forgotSent, setForgotSent] = useState(false);

      const switchMode = (m) => {
        setMode(m);
        setSubmitted(false);
        setForgotSent(false);
      };

      const signInErrors = useMemo(() => {
        const e = {};
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(signInForm.email.trim())) {
          e.email = 'Please enter a valid email address.';
        }
        if (signInForm.password.length < 4) {
          e.password = 'Password must be at least 4 characters.';
        }
        return e;
      }, [signInForm]);

      const signUpErrors = useMemo(() => {
        const e = {};
        if (!signUpForm.firstName.trim()) e.firstName = 'First name is required.';
        if (!signUpForm.lastName.trim()) e.lastName = 'Last name is required.';
        if (role === 'roaster' && !signUpForm.roasteryName.trim()) {
          e.roasteryName = 'Roastery or store name is required.';
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(signUpForm.email.trim())) {
          e.email = 'Enter a valid email address.';
        }
        if (!/^(\+?62|0)8\d{7,12}$/.test(signUpForm.phone.replace(/[\s-]/g, ''))) {
          e.phone = 'Enter a valid Indonesian mobile number (e.g. 0812...).';
        }
        if (signUpForm.password.length < 6) {
          e.password = 'Password must be at least 6 characters.';
        }
        if (!signUpForm.agree) {
          e.agree = 'Please accept the terms to continue.';
        }
        return e;
      }, [signUpForm, role]);

      const passwordStrength = useMemo(() => {
        const p = signUpForm.password;
        if (!p) return { score: 0, label: '' };
        let s = 1;
        if (p.length >= 6) s++;
        if (p.length >= 10 || /[A-Z]/.test(p)) s++;
        if (/\d/.test(p) || /[^A-Za-z0-9]/.test(p)) s++;
        const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
        return { score: Math.min(4, s), label: labels[Math.min(4, s)] };
      }, [signUpForm.password]);

      const finishLogin = (userObj, message) => {
        setLoading(true);
        setTimeout(() => {
          BM.auth.login(userObj);
          setCurrentUser(userObj);
          setLoading(false);
          setToastMsg(message || ('Welcome back, ' + userObj.firstName + '!'));
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 700);
        }, 650);
      };

      const handleDemoLogin = (type) => {
        const demo = BM.auth.demos[type];
        setSignInForm({ email: demo.email, password: '••••••••••' });
        finishLogin(demo, 'Signed in as ' + demo.name);
      };

      const handleSignInSubmit = (e) => {
        e.preventDefault();
        setSubmitted(true);
        if (Object.keys(signInErrors).length > 0) return;

        const emailLower = signInForm.email.trim().toLowerCase();
        if (emailLower === BM.auth.demos.roaster.email) {
          finishLogin(BM.auth.demos.roaster);
          return;
        }
        if (emailLower === BM.auth.demos.buyer.email) {
          finishLogin(BM.auth.demos.buyer);
          return;
        }

        // Build user profile from custom email
        const rawName = emailLower.split('@')[0].replace(/[._-]+/g, ' ');
        const parts = rawName.split(' ').filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1));
        const firstName = parts[0] || 'Kopi';
        const lastName = parts.slice(1).join(' ') || 'Lover';
        const initials = (firstName[0] + (lastName[0] || '')).toUpperCase();

        finishLogin({
          name: firstName + ' ' + lastName,
          firstName,
          lastName,
          initials,
          email: signInForm.email.trim(),
          role: 'buyer',
          phone: '081234567890',
          address: 'Jl. Senopati No. 42, Kebayoran Baru',
          city: 'Jakarta Selatan',
          zip: '12190'
        });
      };

      const handleSignUpSubmit = (e) => {
        e.preventDefault();
        setSubmitted(true);
        if (Object.keys(signUpErrors).length > 0) return;

        const firstName = signUpForm.firstName.trim();
        const lastName = signUpForm.lastName.trim();
        const displayName = role === 'roaster'
          ? signUpForm.roasteryName.trim()
          : (firstName + ' ' + lastName);
        const initials = role === 'roaster'
          ? signUpForm.roasteryName.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase()
          : (firstName[0] + lastName[0]).toUpperCase();

        finishLogin({
          name: displayName,
          firstName,
          lastName,
          initials,
          email: signUpForm.email.trim(),
          role,
          phone: signUpForm.phone.trim(),
          address: 'Jl. Kemang Raya No. 15',
          city: signUpForm.city.trim() || 'Jakarta Selatan',
          zip: '12730'
        }, 'Account created! Welcome to KopiKonek, ' + firstName + '.');
      };

      const handleSocialLogin = (provider) => {
        finishLogin({
          ...BM.auth.demos.buyer,
          provider
        }, 'Signed in with ' + provider);
      };

      const handleForgotSubmit = (e) => {
        e.preventDefault();
        setSubmitted(true);
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(forgotEmail.trim())) return;
        setForgotSent(true);
      };

      const shownSignInErr = submitted ? signInErrors : {};
      const shownSignUpErr = submitted ? signUpErrors : {};

      return (
        <div className="flex min-h-screen flex-col">
          {/* Minimal Header */}
          <header className="border-b border-espresso/10 bg-cream/85 backdrop-blur-md">
            <div className="mx-auto flex h-20 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
              <a href="index.html" className="inline-flex items-center gap-2 text-sm font-medium text-espresso/70 transition hover:text-espresso">
                <svg className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" d="m15 6-6 6 6 6" />
                </svg>
                <span className="hidden sm:inline">Back to Marketplace</span>
                <span className="sm:hidden">Back</span>
              </a>

              <a href="index.html" className="flex items-center gap-2 font-serif text-2xl font-bold tracking-tight">
                <span className="grid h-8 w-8 place-items-center rounded-full bg-espresso text-cream">
                  <svg className="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C7 5 4.5 9 6 14c1.2 4 5 7 6 8 1-1 4.8-4 6-8 1.5-5-1-9-6-12Zm-.2 5.2c1.8 2.3 1.8 5.3.4 9.6-.2.6-1 .6-.8-.1 1-3.6 1-6.2.4-9.5Z" />
                  </svg>
                </span>
                KopiKonek
              </a>

              <div className="flex items-center gap-1.5 text-xs font-medium text-espresso/60">
                <svg className="h-4 w-4 text-sage" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24">
                  <rect x="5" y="11" width="14" height="9" rx="2" />
                  <path strokeLinecap="round" d="M8 11V8a4 4 0 0 1 8 0v3" />
                </svg>
                <span className="hidden sm:inline">Secure Account Portal</span>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="mx-auto flex w-full max-w-7xl flex-1 items-center px-4 py-10 sm:px-6 lg:px-8 lg:py-14">
            <div className="grid w-full grid-cols-1 gap-10 lg:grid-cols-12 lg:gap-12 items-stretch">

              {/* LEFT COLUMN: Editorial Coffee Story & Perks */}
              <div className="relative overflow-hidden rounded-[2rem] bg-espresso p-8 text-cream shadow-2xl shadow-espresso/15 sm:p-10 lg:col-span-5 flex flex-col justify-between">
                <div className="pointer-events-none absolute -right-24 -top-24 h-72 w-72 rounded-full bg-terracotta/25 blur-3xl"></div>
                <div className="pointer-events-none absolute -bottom-24 -left-20 h-72 w-72 rounded-full bg-sage/20 blur-3xl"></div>

                <div className="relative">
                  <span className="inline-flex items-center gap-2 rounded-full border border-cream/15 bg-cream/10 px-3.5 py-1 text-[11px] font-semibold uppercase tracking-widest text-[#E8A27A]">
                    <span className="h-1.5 w-1.5 rounded-full bg-[#E8A27A]"></span>
                    Indonesian Specialty Collective
                  </span>

                  <h1 className="mt-6 font-serif text-3xl font-semibold leading-tight sm:text-4xl">
                    Every great cup begins with the roaster <span className="italic text-[#E8A27A]">who knows its origin.</span>
                  </h1>

                  <p className="mt-4 text-sm leading-relaxed text-cream/70">
                    Join KopiKonek to connect directly with 40+ independent Indonesian micro-roasteries, customize your grind for every brew method, and shop with escrow peace of mind.
                  </p>

                  {/* Feature list */}
                  <ul className="mt-8 space-y-4 text-sm">
                    <li className="flex items-start gap-3.5">
                      <span className="mt-0.5 grid h-6 w-6 flex-shrink-0 place-items-center rounded-full bg-terracotta/20 text-[#E8A27A]">
                        <CheckIcon className="h-3.5 w-3.5" />
                      </span>
                      <div>
                        <p className="font-semibold text-cream">Fresh Roast-Date Guarantee</p>
                        <p className="text-xs text-cream/60">Every bag shows the exact roast date & resting window before it ships.</p>
                      </div>
                    </li>
                    <li className="flex items-start gap-3.5">
                      <span className="mt-0.5 grid h-6 w-6 flex-shrink-0 place-items-center rounded-full bg-terracotta/20 text-[#E8A27A]">
                        <CheckIcon className="h-3.5 w-3.5" />
                      </span>
                      <div>
                        <p className="font-semibold text-cream">Saved Grind & Brew Profile</p>
                        <p className="text-xs text-cream/60">Pre-select Whole Bean, V60, Espresso or French Press across orders.</p>
                      </div>
                    </li>
                    <li className="flex items-start gap-3.5">
                      <span className="mt-0.5 grid h-6 w-6 flex-shrink-0 place-items-center rounded-full bg-terracotta/20 text-[#E8A27A]">
                        <CheckIcon className="h-3.5 w-3.5" />
                      </span>
                      <div>
                        <p className="font-semibold text-cream">Multi-Vendor Escrow Protection</p>
                        <p className="text-xs text-cream/60">Combine beans and gear from multiple cities in one seamless checkout.</p>
                      </div>
                    </li>
                  </ul>
                </div>

                {/* Editorial Image + Quote Card */}
                <div className="relative mt-10 overflow-hidden rounded-2xl border border-cream/10 bg-cream/5 p-4 backdrop-blur-sm">
                  <div className="flex items-center gap-4">
                    <img
                      src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&q=80&w=300"
                      alt="Specialty coffee pour-over"
                      onError={(e) => { e.currentTarget.onerror = null; e.currentTarget.src = BM.fallback; }}
                      className="h-16 w-16 flex-shrink-0 rounded-xl object-cover"
                    />
                    <div className="min-w-0">
                      <p className="text-xs italic leading-relaxed text-cream/85">
                        “Since joining KopiKonek, our Kamojang micro-lots reach home brewers in Jakarta within 48 hours of roasting.”
                      </p>
                      <p className="mt-1.5 text-[11px] font-semibold uppercase tracking-wider text-[#E8A27A]">
                        — Kala Roastery · Bandung
                      </p>
                    </div>
                  </div>
                </div>
              </div>

              {/* RIGHT COLUMN: Auth Card */}
              <div className="lg:col-span-7 flex flex-col justify-center">
                <div className="mx-auto w-full max-w-xl rounded-[2rem] border border-espresso/10 bg-white p-6 shadow-xl shadow-espresso/5 sm:p-10">

                  {/* If user is already signed in, show active session banner */}
                  {currentUser && (
                    <div className="mb-7 flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-sage/40 bg-sage/10 p-4 fade-in">
                      <div className="flex items-center gap-3">
                        <span className="grid h-10 w-10 place-items-center rounded-full bg-espresso text-xs font-bold text-cream">
                          {currentUser.initials || 'KK'}
                        </span>
                        <div>
                          <p className="text-xs font-semibold uppercase tracking-wider text-[#3E5445]">Currently Signed In</p>
                          <p className="text-sm font-semibold text-espresso">{currentUser.name} <span className="font-normal text-espresso/60">({currentUser.email})</span></p>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <a href={redirectUrl} className="rounded-full bg-espresso px-4 py-2 text-xs font-semibold text-cream transition hover:bg-espresso/90">
                          Continue to {redirectLabel} →
                        </a>
                        <button
                          type="button"
                          onClick={() => { BM.auth.logout(); setCurrentUser(null); }}
                          className="rounded-full border border-espresso/20 px-3 py-2 text-xs font-medium text-espresso/70 transition hover:border-espresso hover:text-espresso"
                        >
                          Sign Out
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Mode Switcher Tabs */}
                  {mode !== 'forgot' && (
                    <div className="grid grid-cols-2 rounded-full bg-cream p-1.5 border border-espresso/10" role="tablist">
                      <button
                        type="button"
                        role="tab"
                        aria-selected={mode === 'signin'}
                        onClick={() => switchMode('signin')}
                        className={'rounded-full py-2.5 text-sm font-semibold transition ' +
                          (mode === 'signin' ? 'bg-espresso text-cream shadow-sm' : 'text-espresso/65 hover:text-espresso')}
                      >
                        Sign In
                      </button>
                      <button
                        type="button"
                        role="tab"
                        aria-selected={mode === 'signup'}
                        onClick={() => switchMode('signup')}
                        className={'rounded-full py-2.5 text-sm font-semibold transition ' +
                          (mode === 'signup' ? 'bg-espresso text-cream shadow-sm' : 'text-espresso/65 hover:text-espresso')}
                      >
                        Create Account
                      </button>
                    </div>
                  )}

                  {/* Instant Demo Bar */}
                  {mode !== 'forgot' && (
                    <div className="mt-6 rounded-2xl border border-dashed border-espresso/15 bg-cream/70 p-3.5">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <span className="text-xs font-medium text-espresso/60">
                          ⚡ <strong className="text-espresso">Quick Demo Login:</strong> One-click test account
                        </span>
                        <div className="flex flex-wrap gap-2">
                          <button
                            type="button"
                            onClick={() => handleDemoLogin('buyer')}
                            className="inline-flex items-center gap-1.5 rounded-full border border-espresso/15 bg-white px-3 py-1.5 text-xs font-semibold text-espresso shadow-sm transition hover:border-terracotta hover:text-terracotta active:scale-95"
                          >
                            <span className="h-2 w-2 rounded-full bg-sage"></span>
                            Rani (Buyer)
                          </button>
                          <button
                            type="button"
                            onClick={() => handleDemoLogin('roaster')}
                            className="inline-flex items-center gap-1.5 rounded-full border border-espresso/15 bg-white px-3 py-1.5 text-xs font-semibold text-espresso shadow-sm transition hover:border-terracotta hover:text-terracotta active:scale-95"
                          >
                            <span className="h-2 w-2 rounded-full bg-terracotta"></span>
                            Kala Roastery (Partner)
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ============ SIGN IN FORM ============ */}
                  {mode === 'signin' && (
                    <form onSubmit={handleSignInSubmit} noValidate className="mt-7 space-y-5 fade-in">
                      <div>
                        <h2 className="font-serif text-2xl font-semibold sm:text-3xl">Welcome back</h2>
                        <p className="mt-1 text-sm text-espresso/60">
                          Sign in to access your saved grind preferences and active orders.
                        </p>
                      </div>

                      <div>
                        <label htmlFor="si-email" className="mb-1.5 block text-sm font-medium">Email address</label>
                        <input
                          id="si-email"
                          type="email"
                          autoComplete="email"
                          placeholder="rani.wijaya@kopikonek.id"
                          value={signInForm.email}
                          onChange={(e) => setSignInForm({ ...signInForm, email: e.target.value })}
                          className={inputClass(shownSignInErr.email)}
                        />
                        {shownSignInErr.email && <p className="mt-1.5 text-xs text-red-600">{shownSignInErr.email}</p>}
                      </div>

                      <div>
                        <div className="mb-1.5 flex items-center justify-between">
                          <label htmlFor="si-pass" className="text-sm font-medium">Password</label>
                          <button
                            type="button"
                            onClick={() => switchMode('forgot')}
                            className="text-xs font-semibold text-terracotta hover:underline"
                          >
                            Forgot password?
                          </button>
                        </div>
                        <div className="relative">
                          <input
                            id="si-pass"
                            type={showPass ? 'text' : 'password'}
                            autoComplete="current-password"
                            placeholder="Enter your password"
                            value={signInForm.password}
                            onChange={(e) => setSignInForm({ ...signInForm, password: e.target.value })}
                            className={inputClass(shownSignInErr.password) + ' pr-11'}
                          />
                          <button
                            type="button"
                            onClick={() => setShowPass(!showPass)}
                            aria-label={showPass ? 'Hide password' : 'Show password'}
                            className="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-espresso/45 transition hover:bg-espresso/5 hover:text-espresso"
                          >
                            <EyeIcon open={showPass} />
                          </button>
                        </div>
                        {shownSignInErr.password && <p className="mt-1.5 text-xs text-red-600">{shownSignInErr.password}</p>}
                      </div>

                      <div className="flex items-center justify-between text-sm">
                        <label className="inline-flex cursor-pointer items-center gap-2.5 text-espresso/75">
                          <input
                            type="checkbox"
                            checked={remember}
                            onChange={(e) => setRemember(e.target.checked)}
                            className="h-4 w-4 rounded border-espresso/30 accent-[#CC5500] focus:ring-terracotta"
                          />
                          <span>Keep me signed in for 30 days</span>
                        </label>
                      </div>

                      <button
                        type="submit"
                        disabled={loading}
                        className="flex w-full items-center justify-center gap-2 rounded-full bg-terracotta py-4 text-sm font-semibold text-white shadow-lg shadow-terracotta/25 transition duration-300 hover:-translate-y-0.5 hover:bg-[#B34A00] active:scale-[.98] disabled:opacity-75"
                      >
                        {loading ? (
                          <>
                            <svg className="spinner h-4 w-4" viewBox="0 0 24 24" fill="none">
                              <circle cx="12" cy="12" r="9" stroke="currentColor" strokeOpacity=".3" strokeWidth="3" />
                              <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" strokeWidth="3" strokeLinecap="round" />
                            </svg>
                            Signing in…
                          </>
                        ) : (
                          <>Sign In to KopiKonek</>
                        )}
                      </button>
                    </form>
                  )}

                  {/* ============ CREATE ACCOUNT FORM ============ */}
                  {mode === 'signup' && (
                    <form onSubmit={handleSignUpSubmit} noValidate className="mt-7 space-y-5 fade-in">
                      <div>
                        <h2 className="font-serif text-2xl font-semibold sm:text-3xl">Create your account</h2>
                        <p className="mt-1 text-sm text-espresso/60">
                          Start exploring freshly roasted Indonesian single-origins and brewing gear.
                        </p>
                      </div>

                      {/* Role Selector */}
                      <fieldset>
                        <legend className="mb-2 block text-xs font-semibold uppercase tracking-wider text-espresso/55">I am joining as a</legend>
                        <div className="grid grid-cols-2 gap-3">
                          <label className={'flex cursor-pointer items-center gap-3 rounded-xl border p-3.5 text-sm transition ' +
                            (role === 'buyer' ? 'border-terracotta bg-terracotta/[0.05] ring-1 ring-terracotta' : 'border-espresso/15 hover:border-espresso/35')}>
                            <input type="radio" name="role" className="sr-only" checked={role === 'buyer'} onChange={() => setRole('buyer')} />
                            <span className="grid h-8 w-8 place-items-center rounded-full bg-sage/20 text-[#3E5445] font-semibold text-xs">☕</span>
                            <div>
                              <p className="font-semibold leading-tight">Coffee Lover</p>
                              <p className="text-xs text-espresso/55">Personal buyer</p>
                            </div>
                          </label>
                          <label className={'flex cursor-pointer items-center gap-3 rounded-xl border p-3.5 text-sm transition ' +
                            (role === 'roaster' ? 'border-terracotta bg-terracotta/[0.05] ring-1 ring-terracotta' : 'border-espresso/15 hover:border-espresso/35')}>
                            <input type="radio" name="role" className="sr-only" checked={role === 'roaster'} onChange={() => setRole('roaster')} />
                            <span className="grid h-8 w-8 place-items-center rounded-full bg-terracotta/15 text-terracotta font-semibold text-xs">🔥</span>
                            <div>
                              <p className="font-semibold leading-tight">Roastery / Seller</p>
                              <p className="text-xs text-espresso/55">Partner store</p>
                            </div>
                          </label>
                        </div>
                      </fieldset>

                      <div className="grid gap-4 sm:grid-cols-2">
                        <div>
                          <label htmlFor="su-first" className="mb-1.5 block text-sm font-medium">First name</label>
                          <input
                            id="su-first"
                            type="text"
                            placeholder="Rani"
                            value={signUpForm.firstName}
                            onChange={(e) => setSignUpForm({ ...signUpForm, firstName: e.target.value })}
                            className={inputClass(shownSignUpErr.firstName)}
                          />
                          {shownSignUpErr.firstName && <p className="mt-1 text-xs text-red-600">{shownSignUpErr.firstName}</p>}
                        </div>
                        <div>
                          <label htmlFor="su-last" className="mb-1.5 block text-sm font-medium">Last name</label>
                          <input
                            id="su-last"
                            type="text"
                            placeholder="Wijaya"
                            value={signUpForm.lastName}
                            onChange={(e) => setSignUpForm({ ...signUpForm, lastName: e.target.value })}
                            className={inputClass(shownSignUpErr.lastName)}
                          />
                          {shownSignUpErr.lastName && <p className="mt-1 text-xs text-red-600">{shownSignUpErr.lastName}</p>}
                        </div>
                      </div>

                      {role === 'roaster' && (
                        <div className="fade-in">
                          <label htmlFor="su-roastery" className="mb-1.5 block text-sm font-medium">Roastery / Brand Name</label>
                          <input
                            id="su-roastery"
                            type="text"
                            placeholder="e.g. Sunda Hejo Roastery"
                            value={signUpForm.roasteryName}
                            onChange={(e) => setSignUpForm({ ...signUpForm, roasteryName: e.target.value })}
                            className={inputClass(shownSignUpErr.roasteryName)}
                          />
                          {shownSignUpErr.roasteryName && <p className="mt-1 text-xs text-red-600">{shownSignUpErr.roasteryName}</p>}
                        </div>
                      )}

                      <div className="grid gap-4 sm:grid-cols-2">
                        <div>
                          <label htmlFor="su-email" className="mb-1.5 block text-sm font-medium">Email address</label>
                          <input
                            id="su-email"
                            type="email"
                            placeholder="you@email.com"
                            value={signUpForm.email}
                            onChange={(e) => setSignUpForm({ ...signUpForm, email: e.target.value })}
                            className={inputClass(shownSignUpErr.email)}
                          />
                          {shownSignUpErr.email && <p className="mt-1 text-xs text-red-600">{shownSignUpErr.email}</p>}
                        </div>
                        <div>
                          <label htmlFor="su-phone" className="mb-1.5 block text-sm font-medium">WhatsApp / Phone</label>
                          <input
                            id="su-phone"
                            type="tel"
                            placeholder="0812 3456 7890"
                            value={signUpForm.phone}
                            onChange={(e) => setSignUpForm({ ...signUpForm, phone: e.target.value })}
                            className={inputClass(shownSignUpErr.phone)}
                          />
                          {shownSignUpErr.phone && <p className="mt-1 text-xs text-red-600">{shownSignUpErr.phone}</p>}
                        </div>
                      </div>

                      <div>
                        <label htmlFor="su-pass" className="mb-1.5 block text-sm font-medium">Create password</label>
                        <div className="relative">
                          <input
                            id="su-pass"
                            type={showPass ? 'text' : 'password'}
                            placeholder="At least 6 characters"
                            value={signUpForm.password}
                            onChange={(e) => setSignUpForm({ ...signUpForm, password: e.target.value })}
                            className={inputClass(shownSignUpErr.password) + ' pr-11'}
                          />
                          <button
                            type="button"
                            onClick={() => setShowPass(!showPass)}
                            className="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-espresso/45 transition hover:bg-espresso/5 hover:text-espresso"
                          >
                            <EyeIcon open={showPass} />
                          </button>
                        </div>
                        {signUpForm.password && (
                          <div className="mt-2 flex items-center gap-2">
                            <div className="flex flex-1 gap-1.5">
                              {[1, 2, 3, 4].map((n) => (
                                <span
                                  key={n}
                                  className={'h-1.5 flex-1 rounded-full transition-colors ' +
                                    (passwordStrength.score >= n
                                      ? (passwordStrength.score <= 2 ? 'bg-terracotta' : 'bg-sage')
                                      : 'bg-espresso/10')}
                                />
                              ))}
                            </div>
                            <span className="text-xs font-medium text-espresso/60">{passwordStrength.label}</span>
                          </div>
                        )}
                        {shownSignUpErr.password && <p className="mt-1 text-xs text-red-600">{shownSignUpErr.password}</p>}
                      </div>

                      <div>
                        <label className="inline-flex cursor-pointer items-start gap-2.5 text-xs text-espresso/70">
                          <input
                            type="checkbox"
                            checked={signUpForm.agree}
                            onChange={(e) => setSignUpForm({ ...signUpForm, agree: e.target.checked })}
                            className="mt-0.5 h-4 w-4 rounded border-espresso/30 accent-[#CC5500] focus:ring-terracotta"
                          />
                          <span>
                            I agree to KopiKonek’s <a href="#terms" onClick={(e) => e.preventDefault()} className="font-semibold text-espresso underline">Terms of Service</a>, <a href="#privacy" onClick={(e) => e.preventDefault()} className="font-semibold text-espresso underline">Privacy Policy</a>, and Escrow Buyer Protection rules.
                          </span>
                        </label>
                        {shownSignUpErr.agree && <p className="mt-1 text-xs text-red-600">{shownSignUpErr.agree}</p>}
                      </div>

                      <button
                        type="submit"
                        disabled={loading}
                        className="flex w-full items-center justify-center gap-2 rounded-full bg-terracotta py-4 text-sm font-semibold text-white shadow-lg shadow-terracotta/25 transition duration-300 hover:-translate-y-0.5 hover:bg-[#B34A00] active:scale-[.98] disabled:opacity-75"
                      >
                        {loading ? 'Creating account…' : 'Create KopiKonek Account'}
                      </button>
                    </form>
                  )}

                  {/* ============ FORGOT PASSWORD VIEW ============ */}
                  {mode === 'forgot' && (
                    <div className="mt-2 space-y-5 fade-in">
                      <button
                        type="button"
                        onClick={() => switchMode('signin')}
                        className="inline-flex items-center gap-1.5 text-xs font-semibold text-espresso/65 hover:text-espresso"
                      >
                        ← Back to Sign In
                      </button>

                      <div>
                        <h2 className="font-serif text-2xl font-semibold sm:text-3xl">Reset your password</h2>
                        <p className="mt-1 text-sm text-espresso/60">
                          Enter the email associated with your KopiKonek account and we’ll send a reset link.
                        </p>
                      </div>

                      {forgotSent ? (
                        <div className="rounded-2xl border border-sage/40 bg-sage/15 p-5 text-sm text-[#2F4A38] fade-in">
                          <p className="font-semibold">Reset link sent!</p>
                          <p className="mt-1 text-xs leading-relaxed">
                            We’ve sent password recovery instructions to <strong>{forgotEmail}</strong>. Check your inbox or return to sign in.
                          </p>
                          <button
                            type="button"
                            onClick={() => switchMode('signin')}
                            className="mt-4 rounded-full bg-espresso px-5 py-2.5 text-xs font-semibold text-cream transition hover:bg-espresso/90"
                          >
                            Return to Sign In
                          </button>
                        </div>
                      ) : (
                        <form onSubmit={handleForgotSubmit} noValidate className="space-y-4">
                          <div>
                            <label htmlFor="fg-email" className="mb-1.5 block text-sm font-medium">Email address</label>
                            <input
                              id="fg-email"
                              type="email"
                              placeholder="you@email.com"
                              value={forgotEmail}
                              onChange={(e) => setForgotEmail(e.target.value)}
                              className={inputClass(submitted && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(forgotEmail.trim()))}
                            />
                            {submitted && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(forgotEmail.trim()) && (
                              <p className="mt-1.5 text-xs text-red-600">Please enter a valid email address.</p>
                            )}
                          </div>
                          <button
                            type="submit"
                            className="w-full rounded-full bg-terracotta py-3.5 text-sm font-semibold text-white shadow-lg shadow-terracotta/25 transition hover:bg-[#B34A00]"
                          >
                            Send Recovery Link
                          </button>
                        </form>
                      )}
                    </div>
                  )}

                  {/* Social Auth Divider */}
                  {mode !== 'forgot' && (
                    <div className="mt-7">
                      <div className="relative flex items-center justify-center">
                        <span className="flex-1 border-t border-espresso/10"></span>
                        <span className="flex-shrink-0 whitespace-nowrap bg-white px-4 text-xs uppercase tracking-widest text-espresso/45">Or continue with</span>
                        <span className="flex-1 border-t border-espresso/10"></span>
                      </div>

                      <div className="mt-5 grid grid-cols-2 gap-3">
                        <button
                          type="button"
                          onClick={() => handleSocialLogin('Google')}
                          className="flex items-center justify-center gap-2.5 rounded-xl border border-espresso/15 bg-white py-3 text-sm font-medium text-espresso transition hover:border-espresso/40 hover:bg-cream/60 active:scale-95"
                        >
                          <svg className="h-4 w-4" viewBox="0 0 24 24">
                            <path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.2-.9 2.3-2 3l3.2 2.5c1.9-1.7 3-4.3 3-7.3 0-.7-.1-1.4-.2-2.1H12z" />
                            <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.8-5.6-4.1l-3.3 2.5C4.8 19.8 8.1 22 12 22z" />
                            <path fill="#4A90E2" d="M6.4 13.9c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9L3.1 7.6C2.4 9 2 10.4 2 12s.4 3 1.1 4.4l3.3-2.5z" />
                            <path fill="#FBBC05" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9C17 2.9 14.7 2 12 2 8.1 2 4.8 4.2 3.1 7.6l3.3 2.5c.8-2.3 3-4.2 5.6-4.2z" />
                          </svg>
                          Google
                        </button>

                        <button
                          type="button"
                          onClick={() => handleSocialLogin('Apple')}
                          className="flex items-center justify-center gap-2.5 rounded-xl border border-espresso/15 bg-white py-3 text-sm font-medium text-espresso transition hover:border-espresso/40 hover:bg-cream/60 active:scale-95"
                        >
                          <svg className="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M16.4 12.6c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.2.8-.6 0-1.6-.8-2.7-.7-1.4 0-2.7.8-3.4 2-1.5 2.5-.4 6.2 1 8.3.7 1 1.5 2.1 2.6 2.1 1 0 1.4-.7 2.7-.7 1.2 0 1.6.7 2.7.7 1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.1-.8-2.1-3.3zM14.3 6.4c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.2z" />
                          </svg>
                          Apple
                        </button>
                      </div>
                    </div>
                  )}

                </div>
              </div>

            </div>
          </main>

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed inset-x-0 bottom-6 z-50 flex justify-center px-4 fade-in">
              <div className="flex items-center gap-2.5 rounded-full bg-espresso px-5 py-3 text-sm font-medium text-cream shadow-xl">
                <span className="grid h-5 w-5 place-items-center rounded-full bg-sage text-white">
                  <CheckIcon className="h-3 w-3" />
                </span>
                <span>{toastMsg}</span>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LoginApp />);
  </script>
</body>
</html>
